# TwoViewer server configuration, with every setting at its default.
#
# Point TWOVIEWER_CONFIG at a copy of this file to use it. Environment variables override it:
# TWOVIEWER_<SECTION>__<SETTING>, for example TWOVIEWER_HTTP__LISTEN=0.0.0.0:443. Durations are
# written like "500ms", "10s", "5m" or "24h".
#
# Secrets do not belong here. The database URL comes only from the DATABASE_URL environment
# variable, the SMTP user name and password only from SMTP_USERNAME and SMTP_PASSWORD, and the TLS
# private key from the file named by tls.private_key_file (SEC-13).

[http]
# Address of the HTTPS listener. It opens only once migrations have completed (DB-05).
listen = "0.0.0.0:8443"
# Address of the plain-HTTP listener, which redirects every request to HTTPS (SEC-01).
redirect_listen = "0.0.0.0:8080"
# The port clients reach the HTTPS listener on, where redirects point. It differs from the port
# in `listen` when a load balancer or container maps ports.
public_port = 443
# How long browsers remember to use only HTTPS for the site (HSTS, SEC-01), in whole seconds.
# "0s" makes them forget it, which suits development on localhost.
hsts_max_age = "365d"
# How long shutdown waits for open requests and connections before closing them.
shutdown_timeout = "30s"
# The address people reach the web client at, which links in emails point to: https:// and no
# path (http:// only for localhost). There is no default. Links are never made from the Host header
# of a request, which whoever sends it chooses.
# public_url = "https://twoviewer.example"

[tls]
# The certificate of the HTTPS listener (IF-08), as PEM files: the chain, leaf first, and its
# private key. Renewed files are picked up without a restart. There is no default.
# certificate_file = "/run/secrets/tls/fullchain.pem"
# private_key_file = "/run/secrets/tls/privkey.pem"
# Instead of the files, a self-signed certificate for localhost, generated at startup. Browsers
# and Host Agents do not trust it: for development only.
self_signed = false
# How often the files are checked for a renewed certificate.
reload_interval = "5m"
# How long a client gets to complete the TLS handshake before it is disconnected.
handshake_timeout = "10s"

[monitoring]
# Address of the monitoring listener (/livez, /readyz, /metrics). It opens as soon as the server
# starts. Keep it private: it is not meant to be reachable from the internet.
listen = "0.0.0.0:9090"
# How long the readiness check waits for the database before reporting not ready.
readiness_timeout = "2s"

[database]
# How long a migration waits for a table lock before it fails, so that a blocked migration
# cannot queue live traffic behind it (REL-02).
migration_lock_timeout = "10s"

[realtime]
# The real-time connection of browsers and Host Agents (IF-09).
# How often the server sends a heartbeat on each connection. Clients answer every one.
heartbeat_interval = "3s"
# How long a connection may be silent before it counts as lost: the server closes it, and clients
# reconnect. It must be longer than heartbeat_interval. With the defaults, a Host Agent that
# disappears without closing its connection is offline within 10 seconds (DEV-07).
heartbeat_timeout = "8s"
# The largest message a client may send, in bytes.
max_message_bytes = 65536
# How many messages may wait to be sent on one connection. A client that falls this far behind is
# disconnected, and reconnects.
send_queue_length = 64
# How long to wait before retrying when the database connection that receives events from every
# instance cannot be reestablished.
listen_retry_interval = "1s"

[email]
# Transactional emails, such as email verification and password reset (IF-12). They go over SMTP
# to an external email delivery service, which delivers them from a TwoViewer domain whose sender
# authentication (SPF, DKIM and DMARC) is set up with that service.
# The address emails come from, on the TwoViewer domain, and the SMTP server of the email delivery
# service. There are no defaults.
# from_address = "no-reply@mail.twoviewer.example"
# smtp_host = "smtp.email-service.example"
smtp_port = 587
# "starttls" (encrypted after connecting, usually port 587), "tls" (encrypted from the start,
# usually port 465), or "none" (not encrypted: for a local mail catcher in development only).
smtp_security = "starttls"
# How long the SMTP server gets to answer each command, and to accept a connection.
timeout = "30s"
# How often an email is tried before it is given up, including the first attempt. Only temporary
# failures are tried again, such as a refused connection or a 4xx reply; a 5xx reply is final.
max_attempts = 5
# How long to wait before trying an email again. The wait doubles after each further failure.
retry_delay = "1m"
# How many emails may wait to be sent, including those waiting to be tried again. Further emails
# are dropped until there is room.
max_pending = 1000
# How many connections to the SMTP server may be open at once.
max_connections = 10

[passwords]
# The rules for new passwords (AUTH-03) and how passwords are stored (SEC-07). Lengths count
# characters (Unicode code points), not bytes.
# The fewest characters a new password may have.
min_length = 12
# The most characters a new password may have. AUTH-03 requires accepting at least 128.
max_length = 1024
# Passwords are stored as Argon2id hashes. Each hash takes hash_memory_kib of memory and
# hash_iterations passes over it; the defaults (19 MiB, 2 passes, 1 lane) are OWASP's recommended
# minimum. Raising them makes each sign-in slower and guessing harder. New hashes use the new
# values at once, and existing ones are upgraded at their next sign-in.
hash_memory_kib = 19456
hash_iterations = 2
# How many lanes the memory is divided into. They are computed one after the other.
hash_parallelism = 1
# How many passwords may be hashed or checked at once. Further ones wait, so hashing takes at most
# max_concurrent_hashes * hash_memory_kib of memory.
max_concurrent_hashes = 4

[accounts]
# User accounts (AUTH-01).
# How long a link that verifies an email address works (AUTH-02).
verification_link_lifetime = "24h"
# The most characters a display name may have.
display_name_max_length = 100

[sign_up]
# Protection of sign-up against automated abuse (AUTH-15). Sign-ups are counted per network: one
# IPv4 address, or one IPv6 /64. Each instance of the server counts on its own, in memory.
# The time over which sign-ups from one network are counted.
window = "1h"
# How many sign-ups one network may make within the window before the browser must solve a
# proof-of-work challenge, which takes it a second or two. 0 asks for one every time.
challenge_after = 3
# How many sign-ups one network may make within the window at all. Further ones are refused until
# the window has moved on.
max_per_network = 30
# How many networks are counted at once, so that counting takes bounded memory. While that many
# are, sign-ups from other networks need a challenge.
max_tracked_networks = 100000
# How hard a challenge is: the number of leading zero bits the browser must find in a SHA-256
# hash. Each further bit doubles the work. 17 takes a browser a second or two on most laptops. At
# most 32.
challenge_difficulty = 17
# How long the browser has to solve a challenge.
challenge_lifetime = "10m"
# The least time between two emails that sign-ups send to one address, so that sign-up cannot be
# used to flood someone's inbox. Sign-ups in between still get the same answer, but no email.
notice_interval = "15m"

[sign_in]
# Sign-in (AUTH-05) and its protection against guessing (AUTH-08, SEC-08). Failed sign-ins are
# counted per email address, whether or not it has an account, in the database, so that every
# instance sees the same counts. They are also counted per network, one IPv4 address or one IPv6
# /64, in memory by each instance.
# How many failed sign-ins with one email address within the window block sign-in with it.
max_failures = 10
# The time over which failed sign-ins are counted, per address and per network.
failure_window = "15m"
# How long sign-in with an address stays blocked. The owner of the account, if any, is emailed.
block_duration = "15m"
# How many failed sign-ins one network may make within the window. Further attempts are refused
# until the window has moved on.
max_failures_per_network = 50
# How many networks are counted at once, so that counting takes bounded memory. While that many
# are, failures from other networks aren't counted.
max_tracked_networks = 100000
# How long a sign-in lasts at most, however much it is used (AUTH-09). The sign-in cookie is kept
# that long.
session_lifetime = "30d"
# How long a sign-in lasts without being used (AUTH-09). Last activity is recorded at most once a
# minute, so a sign-in may end up to a minute early.
idle_timeout = "7d"

[log]
# "json" (one object per line, for log collectors) or "text" (for development).
format = "json"
# Which logs to write, as tracing filter directives, such as "info" or
# "info,twoviewer_server=debug".
filter = "info"
