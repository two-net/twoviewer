# The complete server side for local development (MNT-07): `docker compose up --build`. Emails go
# to Mailpit, on http://localhost:8025.
# The database keeps its data between runs; `docker compose down --volumes` deletes it.

name: twoviewer

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # A local development credential, reachable only from this machine. Real secrets never go
      # in source control (SEC-13).
      POSTGRES_USER: twoviewer
      POSTGRES_PASSWORD: twoviewer
      POSTGRES_DB: twoviewer
    volumes:
      - postgres:/var/lib/postgresql
    # Published so that `cargo run` and psql can reach it. Set POSTGRES_PORT if 5432 is taken.
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: [CMD, pg_isready, --username=twoviewer, --dbname=twoviewer]
      interval: 2s
      timeout: 5s
      retries: 30

  # Catches every email the server sends, instead of an email delivery service, and shows them on
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    command: [--disable-version-check]
    ports:
      - 127.0.0.1:8025:8025 # the emails sent, in a browser and through Mailpit's API
      - 127.0.0.1:1025:1025 # SMTP, for a server started with `cargo run`

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: twoviewer-server
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://twoviewer:twoviewer@postgres/twoviewer
      TWOVIEWER_LOG__FORMAT: text
      # A certificate for localhost, generated at startup. Browsers warn that they don't trust it.
      TWOVIEWER_TLS__SELF_SIGNED: "true"
      # Redirects from http://localhost:8080 go to the published HTTPS port.
      TWOVIEWER_HTTP__PUBLIC_PORT: 8443
      # Browsers would otherwise remember to use only HTTPS for localhost, on every port, which
      # breaks plain-HTTP development servers such as `ng serve`.
      TWOVIEWER_HTTP__HSTS_MAX_AGE: 0s
      # Emails go to Mailpit, unencrypted. `.test` is a domain reserved for testing.
      TWOVIEWER_EMAIL__FROM_ADDRESS: no-reply@twoviewer.test
      TWOVIEWER_EMAIL__SMTP_HOST: mailpit
      TWOVIEWER_EMAIL__SMTP_PORT: 1025
      TWOVIEWER_EMAIL__SMTP_SECURITY: none
    ports:
      - 127.0.0.1:8443:8443 # HTTPS: the API and web client
      - 127.0.0.1:8080:8080 # plain HTTP, which redirects to HTTPS
      - 127.0.0.1:9090:9090 # monitoring: /livez, /readyz, /metrics

volumes:
  postgres:
