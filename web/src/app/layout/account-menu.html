<button
  #button
  type="button"
  class="button"
  aria-controls="account-menu"
  [attr.aria-expanded]="open()"
  (click)="open.set(!open())"
  i18n="Button that opens the user menu"
>
  Account
</button>
<div id="account-menu" class="panel" [class.open]="open()">
  <app-theme-picker />
  <a class="settings" routerLink="/settings" i18n>Settings</a>
  <button type="button" class="sign-out" [disabled]="signingOut()" (click)="signOut()" i18n>
    Sign out
  </button>
  @if (error(); as error) {
    <app-error-message [error]="error" />
  }
</div>
