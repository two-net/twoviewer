[workspace]
resolver = "3"
members = ["server", "agent", "protocol", "xtask"]
# Without xtask, so a plain `cargo build` does not unify its `schema-sync` feature into the server.
default-members = ["server", "agent", "protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
# Password hashing (SEC-07): Argon2id, with PHC strings and random salts, and its memory cleared
# after use.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash", "zeroize"] }
# Email templates, checked when the server is compiled.
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# `json` for the bodies of the API (`server/src/api.rs`).
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
humantime-serde = "1.1.1"
# Sends transactional emails over SMTP (IF-12), with rustls and ring like the rest, and the
# operating system's certificate store.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "pool", "ring", "rustls-platform-verifier", "smtp-transport", "tokio1-rustls"] }
prometheus-client = "0.25.1"
# Randomizes reconnection delays (REL-05), and makes the tokens of email links.
rand = "0.10.3"
rcgen = "0.14.10"
# Renders the logo for `cargo xtask icons`. It has no text, so no fonts or text shaping.
resvg = { version = "0.49.0", default-features = false }
# rustls and tokio-rustls with ring, which sqlx already uses. Their default features would also
# build aws-lc-rs.
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
# The operating system's certificate store, for the Host Agent.
rustls-platform-verifier = "0.7.1"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-ipnetwork", "with-json", "with-uuid", "postgres-array"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
# Without TLS features: TLS comes from tokio-rustls.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
twoviewer-protocol = { path = "protocol" }
twoviewer-server = { path = "server" }
# Normalizes passwords (NFKC), so the same characters typed on any system give the same hash.
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

# Argon2 is slow by design, and unoptimized it takes seconds per hash: too slow for local runs and
# tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
